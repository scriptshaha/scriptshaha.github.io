<!DOCTYPE html>
<html style="display:none !important;">
<head>
  <title>Auto-Join Proxy</title>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const placeId = params.get('placeId');
    const gameInstanceId = params.get('gameInstanceId');

    if (placeId && gameInstanceId) {
      window.location.href = `roblox://experiences/start?PlaceId=${placeId}&GameInstanceId=${gameInstanceId}`;
    } else {
      document.documentElement.style.display = 'block';
      document.body.innerHTML = "<h3 style='text-align:center;margin-top:2rem;font-family:Arial;'>Error: Missing Place ID or Instance ID!</h3>";
    }
  </script>
</body>
</html>
